# Shared defaults applied to each slide unless that slide overrides them.
pixel_size_um: 0.325

setup:
  channel_patterns: ["*.tif"]
  channel_map_output: channel_map.generated.json
  include_round_in_alias: true
  # Optional post-generation refinements applied consistently to every selected slide.
  remove_aliases: []
  rename_aliases: {}

full_merge:
  enabled: true
  exclude_channels: []
  suffix: _full.ome.tif
  compression: zlib
  tile: [256, 256]
  bigtiff: true

instanseg:
  channels: [R0_DAPI, R0_PANCK, R0_CD45]
  model: fluorescence_nuclei_and_cells
  mode: medium
  prediction_tag: _instanseg_prediction
  tile_size: 2048
  batch_size: 1
  resolve_cell_and_nucleus: true
  cleanup_fragments: true
  seed_threshold: 0.6
  planes:
    nuclei_plane: 0
    cells_plane: 1

mask_export:
  mask_dir: masks_whole_cell
  suffix: _whole_cell.tiff
  nuclear_suffix: _nuclear.tiff
  bigtiff: true
  compression: zlib
  tile: [256, 256]

nimbus:
  enabled: false
  output_dir: nimbus
  # prepared: require nimbus-prepare JSONs before per-slide runs.
  # per_slide: compute normalization during each single-slide Nimbus run.
  normalization_mode: prepared
  # Run `mif-pipeline nimbus-prepare --slides ...` interactively before
  # per-slide batch execution when you want shared normalization across slides.
  # Use either channels or exclude_channels. Aliases should match
  # setup-generated channel_map aliases.
  channels: [R0_DAPI, R0_PANCK, R0_CD45]
  # exclude_channels: []
  channel_chunk_size: 1
  join_keys: [fov, cell_id]
  batch_size: 16
  save_predictions: true
  compile_model: false
  quantile: 0.999
  n_subset: 50
  clip_values: [0, 2]
  multiprocessing: true

spatialdata:
  enabled: false
  suffix: _spatialdata.sdata.zarr
  aggregate: true
  aggregation_mode: mean
  aggregate_cell_labels: true
  aggregate_nuclear_labels: true
  derive_cytoplasm_labels: false
  cytoplasm_subtraction_mode: any_nuclear_overlap
  aggregate_cytoplasm_labels: false
  run_on_gpu: false
  dask_scheduler: processes
  derive_shapes: false
  check_label_overlap: true
  load_nimbus: true
  # This stage is intended to run in a modern Harpy + SpatialData environment
  # after merge / InstanSeg / optional Nimbus file artifacts already exist.

# Optional post-processing against an already-completed canonical SpatialData store.
# This stage is explicit-only and does not alter or rerun any upstream stage.
alignment_qc:
  enabled: false
  output_dir: alignment_qc
  # Exact existing aliases in acquisition order; no alias metadata is inferred or changed.
  reference_channel: null
  channels: []
  target_resolution_um: 2.6
  pyramid_level: null
  zncc_window_size_um: 75.0
  scaling_percentiles: [1.0, 99.9]
  min_local_std_fraction: 0.005
  cell_sampling_radius_um: 2.6
  dense_chunks: [1024, 1024]
  save_dense_maps: true
  write_spatialdata_table: true

provenance:
  enabled: true
  dirname: run_records

slides:
  SLIDE-0272:
    slide_dir: /data1/lowes/ratnayn/Data/CellDive_analysis_data/image_data/SLIDE-0272
    output_dir: /data1/lowes/ratnayn/Data/CellDive_analysis_data/work/SLIDE-0272
    channel_map_file: channel_map.generated.json

  SLIDE-0273:
    slide_dir: /data1/lowes/ratnayn/Data/CellDive_analysis_data/image_data/SLIDE-0273
    output_dir: /data1/lowes/ratnayn/Data/CellDive_analysis_data/work/SLIDE-0273
    channel_map_file: channel_map.generated.json
