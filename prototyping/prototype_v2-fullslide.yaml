# Shared defaults applied to each slide unless that slide overrides them.
pixel_size_um: 0.325

setup:
  channel_patterns: ["*.tif", "*.tiff", "*.ome.tif", "*.ome.tiff"]
  channel_map_output: channel_map.generated.json
  include_round_in_alias: true

full_merge:
  enabled: true
  exclude_channels: []
  suffix: _full_merge.ome.tif
  compression: zlib
  tile: [256, 256]
  bigtiff: true

instanseg:
  channels:
    - R1_DAPI
    - R4_P19_POLYRAT
    - R4_GFP_POLY_AF488
    - R6_CD45_CST_AF647
    - R6_PANCK_AE1_AE3_750
    - R12_CD31_D8V9E_AF750
    - R7_NAK_ATPASE_555
    - R8_F480_D2S9R_555
    - R9_CD68_E3O7V_488
    - R12_CD3E_E4T1B_AF555
  model: fluorescence_nuclei_and_cells
  mode: wsi_global
  prediction_tag: _instanseg_prediction
  tile_size: 2048
  overlap: 80
  detection_size: 20
  batch_size: 1
  normalization_percentiles: [0.1, 99.9]
  reference_channel: R1_DAPI
  resolve_cell_and_nucleus: true
  resolution_method: watershed
  allow_unnucleated_cells: true
  cleanup_fragments: true
  seed_threshold: 0.6
  planes:
    nuclei_plane: 0
    cells_plane: 1

mask_export:
  mask_dir: masks
  suffix: _whole_cell.tiff
  nuclear_suffix: _nuclear.tiff
  bigtiff: true
  compression: zlib
  tile: [256, 256]

nimbus:
  enabled: true
  output_dir: nimbus
  # Prepare shared normalization interactively with `mif-pipeline nimbus-prepare`
  # across the selected slide set, then run each slide job independently.
  # Use either channels or exclude_channels. Aliases should match
  # setup-generated channel_map aliases.
  channels: [R1_DAPI, R4_GFP_POLY_AF488, R4_P19_POLYRAT, R4_ANXA10_647, R4_LGALS4_750]
  # exclude_channels: []
  channel_chunk_size: 1
  join_keys: [fov, cell_id]
  batch_size: 16
  save_predictions: true
  compile_model: false
  quantile: 0.999
  n_subset: 50
  clip_values: [0, 2]
  multiprocessing: true

spatialdata:
  enabled: true
  suffix: _spatialdata.sdata.zarr
  aggregate: true
  aggregate_cell_labels: true
  aggregate_nuclear_labels: true
  run_on_gpu: false
  dask_scheduler: processes
  derive_shapes: false
  check_label_overlap: true
  load_nimbus: true
  # This final assembly stage is intended for a modern Harpy + SpatialData env
  # after merge / InstanSeg / optional Nimbus artifacts already exist.

slides:
  SLIDE-0329:
    slide_dir: /mnt/c/analysis/Data_prototype/SLIDE-0329
    output_dir: /mnt/c/analysis/Data_prototype/SLIDE-0329/outputs
    channel_map_file: channel_map.generated.json
